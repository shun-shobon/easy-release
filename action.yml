name: Easy Release
description: Prepare release PRs and publish releases.
author: NISHIZAWA Shuntaro
branding:
  icon: package
  color: purple
inputs:
  mode:
    description: Action mode (prepare, draft, or publish).
    required: true
  token:
    description: GitHub token with contents write access and pull-requests write access for prepare.
    default: ${{ github.token }}
  config:
    description: Config path relative to the repository root.
    default: .github/easy-release.json
  release-type:
    description: Version bump (major, minor, or patch) for prepare.
  release-id:
    description: Release ID from draft. For publish, provide release-id, tag, and commit together or omit all three to publish from a merged PR.
  tag:
    description: Tag from draft, required when release-id is provided.
  commit:
    description: Commit from draft, required when release-id is provided.
outputs:
  version:
    description: Shared version from prepare, draft, or publish without release inputs.
  tag:
    description: Release tag.
  commit:
    description: Preparation commit in prepare; release commit in draft and publish.
  pull-request-number:
    description: Preparation PR number.
  pull-request-url:
    description: Preparation PR URL.
  ready:
    description: Whether draft or publish without release inputs processed a release. False for unrelated PRs.
  release-id:
    description: Release ID from draft or publish.
  release-url:
    description: Release URL from draft or publish.
runs:
  using: node24
  main: dist/index.mjs
